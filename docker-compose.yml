# 本地开发中间件编排（MySQL 用本机 D:\Mysql，不在此处）
# 启动: docker compose up -d
# 停止: docker compose down
services:
  # 注册中心 + 配置中心
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ./docker-data/nacos:/home/nacos/data
    restart: unless-stopped

  # Redis（缓存 / Sa-Token 会话 / 热度排行 / 分布式锁）
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    # 必须加 --protected-mode no：自定义 command 会绕过镜像默认配置，
    # 否则宿主机经端口映射连接会被 protected mode 拒绝（DENIED）
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no"]
    restart: unless-stopped

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    restart: unless-stopped

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: rocketmq-broker
    depends_on:
      - rocketmq-namesrv
    # 挂载本地 rocketmq/broker.conf（LF 行尾），brokerIP1=127.0.0.1 让宿主机微服务经端口映射访问 broker
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /rootmq/broker.conf
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    volumes:
      - ./rocketmq:/rootmq
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 对象存储（简历 PDF / 头像）——预留组件，代码暂未使用
