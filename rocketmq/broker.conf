# RocketMQ Broker 配置
# brokerIP1：broker 向 NameServer 注册的地址，供客户端连接使用
# 本机开发场景：微服务都跑在 Windows 宿主机上，Docker Desktop 已把 10911/10909 端口映射到宿主机，
# 因此注册 127.0.0.1 即可直连，无需任何域名解析
# （若将来微服务也容器化，再改回 host.docker.internal 或宿主机局域网 IP）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 自动创建 Topic/订阅组，开发环境免手动建主题
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
