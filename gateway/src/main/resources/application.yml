server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: position-service
          uri: lb://position-service
          predicates:
            - Path=/position/**
        - id: resume-service
          uri: lb://resume-service
          predicates:
            - Path=/resume/**
        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/delivery/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notification/**
